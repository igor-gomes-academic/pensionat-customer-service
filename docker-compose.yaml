services:
  customer-db:
    image: mysql:8.4
    container_name: pensionat-customer-db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Europe/Stockholm

    ports:
      - "${DB_HOST_PORT:-3307}:3306"

    volumes:
      - customer_db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - pensionat-network

volumes:
  customer_db_data:
    name: pensionat-customer-db-data

networks:
  pensionat-network:
    name: pensionat-network
    driver: bridge